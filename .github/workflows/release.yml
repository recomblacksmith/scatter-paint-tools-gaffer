name: Release Toolset

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare runner workspace
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker run --rm \
              -v "$GITHUB_WORKSPACE":/workspace \
              alpine:3.20 \
              sh -lc "chown -R $(id -u):$(id -g) /workspace || true; rm -rf /workspace/dist"
          fi
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "VERSION ($version) does not match requested tag ($tag)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=scatter-paint-tools-gaffer-v${version}-linux-gaffer-1.6.18.0.tar.gz" >> "$GITHUB_OUTPUT"
          echo "root=scatter-paint-tools-gaffer-v${version}-linux-gaffer-1.6.18.0" >> "$GITHUB_OUTPUT"
      - name: Build combined toolset
        env:
          IMAGE_NAME: d3smond/scatter-paint-tools-gaffer-build:gaffer-1.6.18.0
        run: ./build-plugins.sh --plugin all --pull
      - name: Prepare user-facing release package
        env:
          GAFFER_VERSION: 1.6.18.0
          TARGET_OS: linux
        run: ./ci/package_release.sh
      - name: Archive Linux release package
        run: tar -czf "${{ steps.version.outputs.archive }}" -C dist/release "${{ steps.version.outputs.root }}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Scatter Paint Tools for Gaffer ${{ steps.version.outputs.tag }}
          files: ${{ steps.version.outputs.archive }}
          generate_release_notes: true
