theme: jekyll-theme-chirpy

lang: en
timezone: UTC

title: Scatter Paint Tools for Gaffer
tagline: Paint, scatter, attach, and bake points directly inside Gaffer
description: >-
  Artist-facing docs, install help, and release notes for Scatter Paint Tools for Gaffer.

url: "https://recomblacksmith.github.io"
baseurl: "/scatter-paint-tools-gaffer"

github:
  username: recomblacksmith

social:
  name: recomblacksmith
  links:
    - https://github.com/recomblacksmith/scatter-paint-tools-gaffer

avatar: /assets/logo/dev-logo.png
social_preview_image: /assets/logo/dev-logo.png

theme_mode: dark
toc: true

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - README.md
  - LICENSE
  - docs
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
